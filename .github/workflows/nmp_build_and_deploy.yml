name: Deploy NoMorePies

on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: nomorepiesacr.azurecr.io
  CONTAINER_APP_NAME: nomorepies-app
  CONTAINER_APP_ENVIRONMENT: mmp-env
  RESOURCE_GROUP: nomorepies-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to ACR
      run: |
        az acr login --name nomorepiesacr

    - name: Build Docker image
      run: |
        docker build -t $ACR_LOGIN_SERVER/nomorepies:${{ github.sha }} .

    - name: Push Docker image
      run: |
        docker push $ACR_LOGIN_SERVER/nomorepies:${{ github.sha }}

    - name: Deploy to Azure Container Apps
      run: |
        az containerapp update \
          --name $CONTAINER_APP_NAME \
          --resource-group $RESOURCE_GROUP \
          --image $ACR_LOGIN_SERVER/nomorepies:${{ github.sha }}
